<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
  <meta name="theme-color" content="#161616">
  <meta name="description" content="Your training, in good form. A private fitness log that works offline.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FORM">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="stylesheet" href="./styles.css">
  <title>FORM. — Your training log</title>
</head>
<body>
  <svg class="icon-library" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"><defs>
    <symbol id="i-dumbbell" viewBox="0 0 24 24"><path d="m6 8 10 10M4 10l6-6m4 16 6-6M2.5 8.5l6-6m7 19 6-6"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><path d="m10 3-.5 2-2 .9-1.9-.6-2 3.4 1.4 1.5v2.3l-1.4 1.6 2 3.4 2-.6 2 .9.4 2.2h4l.5-2.2 2-.9 1.9.6 2-3.4-1.4-1.6v-2.3l1.4-1.5-2-3.4-2 .6-2-.9L14 3z"/><circle cx="12" cy="11.5" r="3"/></symbol>
    <symbol id="i-history" viewBox="0 0 24 24"><path d="M3 11a9 9 0 1 1 2 7M3 5v6h6m3-4v5l3 2"/></symbol>
    <symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 3v17h17M8 14l4-4 4 2 5-7"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14m-6-6 6 6-6 6"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M19 12H5m6-6-6 6 6 6"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="3"/><path d="M15 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h3"/></symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M7 3v4m10-4v4M3 11h18m-13 4h1m6 0h1"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6m0-10v.1"/></symbol>
    <symbol id="i-sync" viewBox="0 0 24 24"><path d="M20 7a9 9 0 0 0-15-2L2 8m0-5v5h5m-3 9a9 9 0 0 0 15 2l3-3m0 5v-5h-5"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12m-5-5 5 5 5-5M4 16v4h16v-4"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="m15 4 5 5M4 20l5-1L20 8a3.5 3.5 0 0 0-5-5L4 14z"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18M9 6V3h6v3M5 6l1 15h12l1-15M10 10v7m4-7v7"/></symbol>
  </defs></svg>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="app-header">
    <div class="brand" aria-label="FORM fitness log"><svg class="brand-icon icon" aria-hidden="true"><use href="#i-dumbbell"/></svg><span>FORM<span class="mint">.</span></span></div>
    <div class="header-actions"><button id="sync-status" class="status-button" aria-label="Synchronization status: Saved on device"><span class="status-dot"></span><span id="sync-label">Saved on device</span></button><button id="settings-button" class="icon-button" aria-label="Settings"><svg class="icon" aria-hidden="true"><use href="#i-settings"/></svg></button></div>
  </header>
  <div id="storage-error" class="storage-error" role="alert" hidden></div>
  <main id="main" tabindex="-1"><div class="loading-state"><span class="eyebrow">YOUR TRAINING, IN GOOD FORM.</span><p>Opening your training log…</p></div></main>
  <nav class="bottom-nav" aria-label="Main navigation">
    <button data-view="workout" aria-current="page"><svg class="icon" aria-hidden="true"><use href="#i-dumbbell"/></svg><span>Workout</span></button>
    <button data-view="history"><svg class="icon" aria-hidden="true"><use href="#i-history"/></svg><span>History</span></button>
    <button data-view="progress"><svg class="icon" aria-hidden="true"><use href="#i-chart"/></svg><span>Progress</span></button>
  </nav>
  <dialog id="modal" aria-labelledby="modal-title"><div id="modal-content"></div></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <noscript><p class="storage-error">Enable JavaScript to use FORM. Your training is stored privately in your browser.</p></noscript>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
